<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shop modern fine jewelry at SOBELLA JEWELRY CO., including earrings, rings, necklaces, and bracelets." />
    <meta name="keywords" content="jewelry, handmade jewelry, necklaces, rings, earrings, bracelets, SoBella Jewelry" />
    <meta property="og:title" content="SOBELLA JEWELRY CO. | Fine Jewelry For Everyday Rituals" />
    <meta property="og:description" content="Discover timeless jewelry pieces crafted for everyday luxury and special occasions." />
    <meta property="og:type" content="website" />
    <meta name="robots" content="index,follow" />
    <title>SOBELLA JEWELRY CO. | Fine Jewelry</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="top-nav">
      <a href="index.html">Shop</a>
      <a href="review.html">Review</a>
    </nav>

    <header class="hero" role="banner">
      <div class="hero-content">
        <p class="eyebrow">Fine Jewelry For Everyday Rituals</p>
        <h1 class="sr-only">SOBELLA JEWELRY CO.</h1>
        <section class="hero-slideshow" aria-label="SOBELLA featured slideshow">
          <div class="hero-slides" id="heroSlides">
            <img class="hero-slide active" src="/assets/logo/sobella-logo.svg" alt="SOBELLA JEWELRY CO. logo" />
          </div>
          <div class="hero-slide-dots" id="heroSlideDots" aria-label="Slideshow navigation"></div>
        </section>
        <section class="bio-section" aria-labelledby="about-sobella">
          <div class="bio-card">
            <h2 id="about-sobella">ABOUT SOBELLA JEWELRY CO.</h2>
            <p id="businessBio">Loading business description...</p>
          </div>
        </section>
        <section class="hero-gallery" aria-label="Gallery placeholders">
          <img src="/assets/placeholders/gallery/gallery-1.svg" alt="Gallery placeholder 1" loading="lazy" />
          <img src="/assets/placeholders/gallery/gallery-2.svg" alt="Gallery placeholder 2" loading="lazy" />
          <img src="/assets/placeholders/gallery/gallery-3.svg" alt="Gallery placeholder 3" loading="lazy" />
          <img src="/assets/placeholders/gallery/gallery-4.svg" alt="Gallery placeholder 4" loading="lazy" />
          <img src="/assets/placeholders/gallery/gallery-5.svg" alt="Gallery placeholder 5" loading="lazy" />
          <img src="/assets/placeholders/gallery/gallery-6.svg" alt="Gallery placeholder 6" loading="lazy" />
          <img src="/assets/placeholders/gallery/gallery-7.svg" alt="Gallery placeholder 7" loading="lazy" />
          <img src="/assets/placeholders/gallery/gallery-8.svg" alt="Gallery placeholder 8" loading="lazy" />
          <img src="/assets/placeholders/gallery/gallery-9.svg" alt="Gallery placeholder 9" loading="lazy" />
          <img src="/assets/placeholders/gallery/gallery-10.svg" alt="Gallery placeholder 10" loading="lazy" />
        </section>
      </div>
    </header>

    <section class="category-strip" aria-labelledby="category-heading">
      <div class="category-strip-inner">
        <h2 id="category-heading">Shop by category</h2>
        <nav class="category-menu" aria-label="Product categories">
          <button class="category-btn active" data-category="all">All products</button>
          <button class="category-btn" data-category="necklaces">Necklaces</button>
          <button class="category-btn" data-category="rings">Rings</button>
          <button class="category-btn" data-category="earrings">Earrings</button>
          <button class="category-btn" data-category="bracelets">Bracelets</button>
        </nav>
      </div>
    </section>

    <main class="layout">
      <section aria-labelledby="collection-heading">
        <h2 id="collection-heading">Our collection</h2>
        <p class="section-copy">Browse elegant handmade jewelry made to shine for everyday wear and special occasions.</p>
        <div id="products" class="products"></div>
      </section>

      <aside class="checkout-card">
        <h2>Bag</h2>
        <p>Review your selections before checkout.</p>
        <div class="checkout-form">
          <button class="review-pay-btn" id="reviewPayButton" type="button">Review and Pay</button>
        </div>
        <p id="statusMessage" class="status"></p>
      </aside>
    </main>

    <script src="app.js"></script>
    <script type="application/ld+json" id="product-schema"></script>
    <script>
      const apiBase = window.location.protocol === 'file:' ? 'http://localhost:3000' : '';
      fetch(`${apiBase}/api/schema/products`)
        .then((response) => response.json())
        .then((data) => {
          const script = document.getElementById('product-schema');
          if (script) {
            script.textContent = JSON.stringify(data);
          }
        })
        .catch(() => {});
    </script>
  </body>
</html>
